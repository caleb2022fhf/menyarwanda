
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080d18">

    <title>Register - MENYARWANDA</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .service-selection {
            border: 1px solid #26364d;
            border-radius: 12px;
            padding: 16px;
            margin: 20px 0;
        }

        .service-option {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px;
            margin-top: 12px;
            border: 1px solid #26364d;
            border-radius: 10px;
            cursor: pointer;
            background: #111b2d;
        }

        .service-option:has(input:checked) {
            border-color: #00c8ff;
            background: #10283a;
        }

        .service-option input {
            margin-top: 4px;
            accent-color: #00c8ff;
        }

        .service-option span {
            display: block;
        }

        .service-name {
            color: #ffffff;
            font-weight: bold;
        }

        .service-description {
            color: #aab8ca;
            font-size: 13px;
            margin-top: 5px;
        }

        .service-extra {
            color: #00c8ff;
            font-size: 12px;
            margin-top: 5px;
        }

        .service-loading {
            text-align: center;
            padding: 18px;
            color: #aab8ca;
        }
    </style>
</head>

<body>

    <header class="main-header">
        <a href="index.html" class="logo">MENYARWANDA</a>
        <span class="muted">Create Account</span>
    </header>

    <main class="container" style="max-width:500px;padding-top:45px;">

        <div class="card">

            <h1 style="text-align:center;">Create Your Account</h1>

            <p class="muted" style="text-align:center;margin:12px 0 25px;">
                Join MENYARWANDA and explore multiple opportunities.
            </p>

            <form id="register-form">

                <label for="full-name">Full Name</label>
                <input
                    type="text"
                    id="full-name"
                    placeholder="Enter your full name"
                    required
                    minlength="3"
                    autocomplete="name"
                >

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                >

                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required
                    autocomplete="tel"
                >

                <label for="pin">Create PIN</label>
                <input
                    type="password"
                    id="pin"
                    placeholder="Create a secure PIN"
                    required
                    minlength="8"
                    autocomplete="new-password"
                >

                <label for="confirm-pin">Confirm PIN</label>
                <input
                    type="password"
                    id="confirm-pin"
                    placeholder="Confirm your PIN"
                    required
                    minlength="8"
                    autocomplete="new-password"
                >

                <p class="muted" style="font-size:13px;margin:10px 0 20px;">
                    Use at least 8 characters, including letters and numbers.
                </p>

                <fieldset class="service-selection">
                    <legend style="font-weight:bold;padding:0 6px;">
                        Select Your Digital Service
                    </legend>

                    <p class="muted" style="font-size:13px;margin:8px 0;">
                        Choose one service you want to join.
                    </p>

                    <div id="services-list" aria-live="polite">
                        <p class="service-loading">Loading available services...</p>
                    </div>
                </fieldset>

                <button
                    type="submit"
                    class="primary-btn"
                    id="register-button"
                    disabled
                >
                    Create Account
                </button>

                <p
                    id="register-message"
                    role="status"
                    aria-live="polite"
                    style="margin-top:18px;text-align:center;"
                ></p>

            </form>

            <p class="muted" style="text-align:center;margin-top:22px;">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/register.js"></script>

</body>
</html>
