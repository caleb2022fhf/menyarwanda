
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080d18">

    <title>Login - MENYARWANDA</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="main-header">
        <a href="index.html" class="logo">MENYARWANDA</a>
        <span class="muted">Welcome Back</span>
    </header>

    <main class="container" style="max-width:450px;padding-top:60px;">

        <div class="card">

            <h1 style="text-align:center;">Login</h1>

            <p class="muted" style="text-align:center;margin:12px 0 25px;">
                Access your MENYARWANDA account.
            </p>

            <form id="login-form">

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                    autocomplete="email"
                >

                <label for="pin">PIN / Password</label>

                <input
                    type="password"
                    id="pin"
                    placeholder="Enter your PIN"
                    required
                    autocomplete="current-password"
                >

                <button
                    type="submit"
                    class="primary-btn"
                    id="login-button"
                >
                    Login
                </button>

                <p
                    id="login-message"
                    role="status"
                    aria-live="polite"
                    style="margin-top:18px;text-align:center;"
                ></p>

            </form>

            <p class="muted" style="text-align:center;margin-top:22px;">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/login.js"></script>

</body>
</html>
