
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MENYARWANDA | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: #171717;
            border: 1px solid #303030;
            border-radius: 17px;
            padding: 30px;
        }

        .logo {
            width: 50px;
            height: 50px;
            background: #10382d;
            border: 1px solid #009d70;
            border-radius: 12px;
            color: #00d69a;
            display: grid;
            place-items: center;
            font-size: 23px;
            font-weight: bold;
            margin: 0 auto 14px;
        }

        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            font-size: 13px;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            color: #bbb;
            font-size: 12px;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            height: 44px;
            background: #050505;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 0 13px;
            color: white;
            outline: none;
            font-size: 13px;
        }

        input:focus, select:focus {
            border-color: #00c98c;
        }

        input::placeholder {
            color: #999;
        }

        input[type="file"] {
            height: auto;
            padding: 8px;
        }

        input[type="file"]::file-selector-button {
            background: #009d70;
            color: white;
            border: none;
            border-radius: 7px;
            padding: 7px 12px;
            margin-right: 8px;
        }

        button {
            width: 100%;
            height: 44px;
            background: #009d70;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #00b986;
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        .switch {
            text-align: center;
            margin-top: 25px;
            color: #aaa;
            font-size: 12px;
        }

        .switch span {
            color: #00d69a;
            font-weight: bold;
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            color: #00d69a;
            font-size: 12px;
            overflow-wrap: anywhere;
            line-height: 1.6;
        }

        .error {
            color: #ff6b6b;
        }

        #preview {
            display: none;
            width: 65px;
            height: 65px;
            object-fit: cover;
            border: 2px solid #00c98c;
            border-radius: 50%;
            margin: 12px auto;
        }

        @media(max-width: 400px) {
            .container {
                padding: 24px 19px;
            }
        }
    </style>
</head>

<body>

<main class="container">

    <div class="logo">M</div>

    <!-- LOGIN -->

    <section id="loginSection">

        <h1>MENYARWANDA</h1>

        <p class="subtitle">Injira muri konti yawe yo kwiga</p>

        <form id="loginForm">

            <div class="form-group">
                <label>Username cyangwa Email</label>
                <input
                    type="text"
                    name="identity"
                    placeholder="Andika username cyangwa email..."
                    autocomplete="username"
                    required>
            </div>

            <div class="form-group">
                <label>Ijambo ry'ibanga (Password)</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Andika password..."
                    autocomplete="current-password"
                    required>
            </div>

            <button type="submit" id="loginButton">
                Injira (Login)
            </button>

        </form>

        <p class="switch">
            Nta konti ufite?
            <span id="showRegister">Fungura Konti</span>
        </p>

    </section>


    <!-- REGISTER -->

    <section id="registerSection" class="hidden">

        <h1>MENYARWANDA</h1>

        <p class="subtitle">Fungura konti nshya yo kwiga</p>

        <form id="registerForm">

            <div class="form-group">
                <label>Izina ry'Umukoresha</label>
                <input
                    type="text"
                    name="username"
                    minlength="3"
                    maxlength="40"
                    placeholder="Andika username..."
                    required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Andika email..."
                    required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    minlength="8"
                    maxlength="72"
                    placeholder="Hitamo password..."
                    required>
            </div>

            <div class="form-group">
                <label>Hitamo Ishami</label>
                <select name="category" required>
                    <option value="">Hitamo ishami...</option>
                    <option value="Agriculture">Agriculture</option>
                    <option value="Driving Laws">Driving Laws</option>
                </select>
            </div>

            <div class="form-group">
                <label>Profile Picture (JPG, PNG, WEBP)</label>
                <input
                    type="file"
                    id="profilePicture"
                    accept="image/jpeg,image/png,image/webp"
                    required>
                <img id="preview" alt="Profile picture preview">
            </div>

            <button type="submit" id="registerButton">
                Emeza Kwiyandikisha (Sign Up)
            </button>

        </form>

        <p class="switch">
            Usanzwe ufite konti?
            <span id="showLogin">Injira hano</span>
        </p>

    </section>

    <p id="message" class="message" role="status" aria-live="polite"></p>

</main>


<script>
    const loginSection = document.getElementById("loginSection");
    const registerSection = document.getElementById("registerSection");
    const message = document.getElementById("message");

    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");

    const loginButton = document.getElementById("loginButton");
    const registerButton = document.getElementById("registerButton");

    const profilePicture = document.getElementById("profilePicture");
    const preview = document.getElementById("preview");

    function showMessage(text, isError = false) {
        message.textContent = text;
        message.classList.toggle("error", isError);
    }

    document.getElementById("showRegister").onclick = function() {
        loginSection.classList.add("hidden");
        registerSection.classList.remove("hidden");
        showMessage("");
    };

    document.getElementById("showLogin").onclick = function() {
        registerSection.classList.add("hidden");
        loginSection.classList.remove("hidden");
        showMessage("");
    };

    async function getResponse(response) {
        const text = await response.text();

        let data;

        try {
            data = JSON.parse(text);
        } catch {
            throw new Error(
                "Server did not return JSON. HTTP " +
                response.status + ": " + text.slice(0, 300)
            );
        }

        if (!response.ok || !data.success) {
            throw new Error(data.message || data.error || "Request failed.");
        }

        return data;
    }

    // IMAGE PREVIEW

    profilePicture.addEventListener("change", function() {
        const file = this.files[0];

        if (!file) return;

        if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
            this.value = "";
            preview.style.display = "none";
            showMessage("Hitamo JPG, PNG cyangwa WEBP.", true);
            return;
        }

        if (file.size > 250 * 1024) {
            this.value = "";
            preview.style.display = "none";
            showMessage("Ifoto igomba kuba munsi ya 250 KB.", true);
            return;
        }

        if (preview.dataset.url) {
            URL.revokeObjectURL(preview.dataset.url);
        }

        const url = URL.createObjectURL(file);
        preview.dataset.url = url;
        preview.src = url;
        preview.style.display = "block";

        showMessage("");
    });

    // LOGIN

    loginForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        loginButton.disabled = true;
        loginButton.textContent = "Turimo kugenzura...";

        showMessage("Turimo kugenzura konti yawe...");

        try {
            const response = await fetch("/api/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "same-origin",
                body: JSON.stringify({
                    identity: this.elements.identity.value.trim(),
                    password: this.elements.password.value
                })
            });

            const data = await getResponse(response);

            showMessage("Winjiye neza. Turagutegurira...");

            window.location.replace(data.redirect);

        } catch (error) {
            console.error("LOGIN ERROR:", error);
            showMessage(error.message, true);
        } finally {
            loginButton.disabled = false;
            loginButton.textContent = "Injira (Login)";
        }
    });

    // REGISTER

    registerForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        const file = profilePicture.files[0];

        if (!file) {
            showMessage("Hitamo ifoto yawe.", true);
            return;
        }

        registerButton.disabled = true;
        registerButton.textContent = "Turimo kwandikisha...";

        showMessage("Turimo kubika amakuru yawe...");

        try {
            const profileImage = await new Promise((resolve, reject) => {
                const reader = new FileReader();

                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(new Error("Ntibyashobotse gusoma ifoto."));

                reader.readAsDataURL(file);
            });

            const response = await fetch("/api/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "same-origin",
                body: JSON.stringify({
                    username: this.elements.username.value.trim(),
                    email: this.elements.email.value.trim(),
                    password: this.elements.password.value,
                    category: this.elements.category.value,
                    profileImage
                })
            });

            const data = await getResponse(response);

            showMessage(
                "Konti yafunguwe neza! Ubu ushobora kwinjira ukoresheje username cyangwa email."
            );

            registerForm.reset();
            preview.style.display = "none";

            registerSection.classList.add("hidden");
            loginSection.classList.remove("hidden");

            loginForm.elements.identity.value = data.user.email;

        } catch (error) {
            console.error("REGISTRATION ERROR:", error);
            showMessage(error.message, true);
        } finally {
            registerButton.disabled = false;
            registerButton.textContent = "Emeza Kwiyandikisha (Sign Up)";
        }
    });
</script>

</body>
</html>
